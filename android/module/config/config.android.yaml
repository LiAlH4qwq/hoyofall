# hoyofall configuration for the Android module.
#
# The module copies this to /data/adb/hoyofall/hoyofall/config.yaml on first
# boot and never overwrites an existing file. Subscription tokens belong in
# /data/adb/hoyofall/hoyofall/hoyofall.env (see hoyofall.env.example),
# referenced here with urlEnv, so this file stays free of secrets.
#
# Point `output.file.path` anywhere readable by your sing-box module. The
# module's own watcher can also copy the fragment into the sing-box config
# directory; see /data/adb/hoyofall/android.conf.

groups:
  custom:
    auto:
      level: 1
      type: urltest
      includeProxies: true
      includeRegexes: []
      onEmpty: skip
    proxy:
      level: 2
      type: selector
      includeProxies: true
      includeLevels: [1]
      includeDirect: true
      onEmpty: skip

convert:
  emitBuiltinOutbounds: false
  proxyNameFormat: "{sub}-{name}"

# A subscription is required by the schema. The seeded hoyofall.env defines
# HOYOFALL_SUB_URL to a closed local port, so the daemon starts, logs one failed
# refresh, writes an empty fragment, and keeps running until you replace it with
# your real subscription URL in hoyofall.env (it never touches this file).
subscriptions:
  default:
    name: default
    urlEnv: HOYOFALL_SUB_URL
    intervalSeconds: 86400
    format: auto
    onUnsupported: skip

output:
  file:
    enabled: true
    mode: aggregate
    path: /data/adb/hoyofall/hoyofall/out/fragment.json
    permissions: "0644"
    pretty: true
  http:
    enabled: false
    listen:
      host: 127.0.0.1
      port: 9090
