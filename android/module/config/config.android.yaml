# hoyofall configuration for the Android module.
#
# The module copies this to /data/adb/hoyofall/config.yaml on first boot and
# never overwrites an existing file. Subscription tokens belong in
# /data/adb/hoyofall/hoyofall.env (see hoyofall.env.example), referenced here
# with urlEnv, so this file stays free of secrets.
#
# Point `output.file.path` anywhere readable by your sing-box module. The
# module's own watcher can also copy the fragment into the sing-box config
# directory; see /data/adb/hoyofall/android.conf.

groups:
  custom:
    auto:
      type: urltest
      includeProxies: true
      includeRegexes: []
      onEmpty: skip
    proxy:
      type: selector
      includeProxies: true
      includeCustomGroups: true
      includeDirect: true
      onEmpty: skip

convert:
  emitBuiltinOutbounds: false
  proxyNameFormat: "{sub}-{name}"

# A subscription is required by the schema. This default points at a closed
# local port so the daemon starts, logs one failed refresh, writes an empty
# fragment, and keeps running; using `urlEnv` without the variable set would fail
# at startup and make the supervisor restart-loop instead.
#
# Replace `url` with your subscription, or switch to `urlEnv: HOYOFALL_SUB_URL`
# and put the token in hoyofall.env.
subscriptions:
  default:
    name: default
    url: "http://127.0.0.1:9/disabled"
    intervalSeconds: 86400
    format: auto
    onUnsupported: skip

output:
  file:
    enabled: true
    mode: aggregate
    path: /data/adb/hoyofall/out/fragment.json
    permissions: "0644"
    pretty: true
  http:
    enabled: false
    listen:
      host: 127.0.0.1
      port: 9090
