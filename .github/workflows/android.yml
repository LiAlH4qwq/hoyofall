# Build the flashable Android module with Nix.
#
# nix/android.nix assembles the module from prebuilt fixed-output downloads
# (Termux aarch64 Node/Nushell and their libraries, plus the upstream SagerNet
# sing-box build). There is no cross-compilation, so the job only needs Nix.

name: android

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  module:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build the flashable module
        run: nix build .#hoyofall-android --print-build-logs

      - name: Upload module
        uses: actions/upload-artifact@v4
        with:
          name: hoyofall-android-arm64
          path: result/hoyofall-android-arm64.zip
          if-no-files-found: error
