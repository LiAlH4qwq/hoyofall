# hoyofall example configuration.
#
# Copy to config.yaml and edit. `config.yaml` is gitignored so local secrets
# never get committed. Every option below is annotated with its default value;
# the same reference (with types) lives in README.md. The JSON Schema is
# available via `hoyofall --print-schema`.
#
# Groups: instance-level `groups.custom` is the recommended way to build
# selector/urltest groups (sing-box cannot match outbounds by regex, so hoyofall
# resolves regexes to explicit tags). Per-subscription `subscriptions.<id>.groups`
# is an advanced feature; most users do not need it.

# ---------------------------------------------------------------------------
# groups (instance-level, recommended)
# ---------------------------------------------------------------------------
# Custom groups select members across all subscriptions by the `<sub>/<name>`
# key (subscription name / original proxy or group name). The group id is used
# as the final outbound tag verbatim.
groups:
  custom:
    # A urltest group of every Hong Kong node from any subscription.
    auto-hk:
      type: urltest                       # selector | urltest. Default: selector
      includeProxies: true                # Default: true
      includeNativeGroups: false          # Default: false
      includeCustomGroups: false          # Default: false
      includeRegex: ["/HK"]               # empty = all. Default: []
      excludeRegex: []                    # Default: []
      members: []                         # explicit <sub>/<name> or group id. Default: []
      includeDirect: false                # Default: false
      includeBlock: false                 # Default: false
      onEmpty: skip                       # skip | fail. Default: skip
      url: http://www.gstatic.com/generate_204   # urltest only
      intervalSeconds: 300                # urltest only. Default: 300
      tolerance: 50                       # urltest only. Default: 50
      idleTimeoutSeconds: 1800            # urltest only. Default: 1800
      interruptExistConnections: false    # Default: false

# ---------------------------------------------------------------------------
# convert (instance-wide)
# ---------------------------------------------------------------------------
convert:
  # Emit `direct`/`block` outbounds. Default: false.
  emitBuiltinOutbounds: false
  # Placeholders: {sub} = subscription name (or id), {name} = original proxy/group name.
  # Default: "{sub}-{name}".
  proxyNameFormat: "{sub}-{name}"

# ---------------------------------------------------------------------------
# subscriptions (required, at least one; map keyed by subscription id)
# ---------------------------------------------------------------------------
subscriptions:
  example:
    # Optional display name, used for the {sub} placeholder. Default: the key.
    name: example
    # One of url / urlEnv is required. Prefer urlEnv to keep tokens out of git:
    url: https://example.com/subscribe?token=REPLACE_ME
    # urlEnv: EXAMPLE_SUB_URL
    # Refresh interval in seconds. Default: 3600.
    intervalSeconds: 3600
    # Optional User-Agent header used when fetching. Default: unset.
    userAgent: clash.meta/v1.19.0
    # Payload format: auto | clash | base64. Default: auto.
    format: auto
    # What to do with unsupported/unparsable proxies and groups: skip | fail.
    # Default: skip.
    onUnsupported: skip

    # Drop proxies whose original name matches any regex. Default: [].
    convert:
      exclude: []

    # Advanced: per-subscription groups. Most users only need instance-level
    # `groups.custom` above.
    groups:
      native:                       # the proxy-groups shipped by the subscription
        enable: false               # Default: false
        includeRegex: []            # empty = all. Default: []
        excludeRegex: []            # Default: []
        fallback: urltest           # urltest | skip. Default: urltest
        loadBalance: selector      # selector | urltest | skip. Default: selector
      custom:
        hk:
          type: selector
          includeRegex: ["HK|香港"]   # matches original names within this subscription
          excludeRegex: []
          # same options as instance-level groups (includeProxies, members,
          # includeNativeGroups, includeCustomGroups, includeDirect, includeBlock,
          # default, interruptExistConnections, onEmpty, url, intervalSeconds,
          # tolerance, idleTimeoutSeconds)

# ---------------------------------------------------------------------------
# output (optional; at least one of file / http must be enabled)
# ---------------------------------------------------------------------------
output:
  # File output. Default: { enabled: true, mode: aggregate, path: "hoyofall.json",
  # directory: ".", permissions: "0644", pretty: true }.
  file:
    enabled: true
    mode: aggregate
    path: /run/hoyofall/fragment.json
    # directory: /run/hoyofall
    permissions: "0644"
    pretty: true

  # Optional HTTP endpoint. Default: { enabled: false, listen: { host: "127.0.0.1", port: 9090 } }.
  http:
    enabled: false
    listen:
      host: 127.0.0.1
      port: 9090
